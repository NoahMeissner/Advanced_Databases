<script>
const {DeckGL, MapboxOverlay, ColumnLayer} = deck;
const maxN = Math.max(...DATA.map(d=>d.n)), PMIN=175000, PMAX=3100000;
const stops=[[47,158,143],[232,193,90],[217,104,60],[168,50,74]];
function ramp(m){ let t=Math.max(0,Math.min(1,(m-PMIN)/(PMAX-PMIN)))*3; const i=Math.min(2,t|0),f=t-i,a=stops[i],b=stops[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f]; }
let metric='m';

const map = new maplibregl.Map({
  container:'map',
  style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center:[150.0,-33.2], zoom:5.1, pitch:52, bearing:-14, antialias:true
});
const tip=document.getElementById('tip');

function layer(){
  return new ColumnLayer({
    id:'suburbs', data:DATA, diskResolution:20, radius:2600, extruded:true, pickable:true,
    elevationScale: metric==='m'?0.9:22,
    radiusUnits:'meters',
    getPosition:d=>[d.lon,d.lat],
    getFillColor:d=>[...ramp(d.m),220],
    getElevation:d=> metric==='m'? d.m/1000 : d.n,
    getLineColor:[0,0,0,40], stroked:true,
    onHover:info=>{
      if(info.object){ tip.style.opacity=1; tip.style.left=info.x+'px'; tip.style.top=info.y+'px';
        const d=info.object; const nm=d.s.replace(/(\w)(\w*)/g,(_,a,b)=>a+b.toLowerCase());
        tip.innerHTML=`<b>${nm}</b> &nbsp;<span class="m">$${(d.m/1000).toLocaleString()}k</span><br><span style="opacity:.7;font-size:11px">${d.n} sales · 2024</span>`;
      } else tip.style.opacity=0;
    }
  });
}
const overlay = new MapboxOverlay({interleaved:true, layers:[layer()]});
map.on('load', ()=>{ map.addControl(overlay); map.addControl(new maplibregl.NavigationControl({visualizePitch:true})); });

function setMetric(m){ metric=m; mMed.classList.toggle('on',m==='m'); mVol.classList.toggle('on',m==='n'); overlay.setProps({layers:[layer()]}); }
document.getElementById('mMed').onclick=()=>setMetric('m');
document.getElementById('mVol').onclick=()=>setMetric('n');
</script>
